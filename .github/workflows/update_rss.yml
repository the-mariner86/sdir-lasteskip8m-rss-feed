name: Update Sdir RSS Feed

on:
  schedule:
    # Runs every day at 07:00 UTC (08:00 CET)
    - cron: '0 7 * * *'
  workflow_dispatch: # Allows you to run it manually from the Actions tab

permissions:
  contents: write

jobs:
  build-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 feedgen

      - name: Run scraper script
        run: python generate_sdir_rss.py

      - name: Commit and push updated feed
        run: |
          git config --local user.email "github-actions[bot]@://github.com"
          git config --local user.name "github-actions[bot]"
          git add sdir_lasteskip_under_8m.xml sdir_page_state.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update RSS feed" && git push)
